# Pemeriksaan otomatis: tipe, seluruh tes, dan build image Docker.
# Berjalan untuk setiap push ke develop dan setiap pull request, dan dipanggil
# ulang oleh deploy.yml sebelum versi baru dipasang ke VM
name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_call:

# Push baru ke branch yang sama membatalkan pemeriksaan lama yang masih jalan
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Repositori ini publik: commit yang membawa kunci, token, atau password
  # harus tertahan sebelum masuk. Yang dipindai hanya commit baru pada push
  # atau pull request ini; pengecualian nilai tiruan ada di .gitleaks.toml
  secrets:
    name: Pindai rahasia
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Type check dan tes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Nilai tiruan. env.ts mewajibkan keduanya saat dimuat, sedangkan tes
    # memakai database tiruan sehingga tidak pernah menyambung ke sini
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-secret-only-for-tests-at-least-32-chars

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Gagal bila ada kerentanan high/critical di dependency yang ikut ke
      # image production. Dependency dev tidak ikut image (npm ci --omit=dev)
      - name: Audit dependency production
        run: npm audit --omit=dev --audit-level=high

      - run: npx tsc --noEmit
      - run: npm test

  docker:
    name: Build image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Hanya memastikan Dockerfile masih bisa dibangun, image tidak dikirim
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

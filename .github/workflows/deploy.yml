# Deploy ke VM setiap ada push ke main:
#   1. CI lengkap (ci.yml)
#   2. build image lalu kirim ke GitHub Container Registry
#   3. SSH ke VM, VM menarik image tersebut dan menyalakannya
#
# Bisa juga dijalankan manual dari tab Actions, misalnya untuk deploy ulang
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Dua deploy tidak boleh berjalan bersamaan. Deploy berikutnya menunggu,
# tidak membatalkan yang sedang setengah jalan
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # GHCR mewajibkan huruf kecil
  IMAGE: ghcr.io/deadbear34/hris-backend

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: Build dan kirim image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN dibuat otomatis per workflow, tidak perlu disimpan
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag commit untuk rollback, latest untuk menyalakan manual di VM
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Pasang ke VM
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secret VM disimpan di environment ini, lihat README bagian CI/CD
    environment: production

    steps:
      - name: Siapkan kunci SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Sidik jari VM ditetapkan di secret, bukan diambil saat itu juga.
          # Dengan begitu pipeline menolak bila ada yang menyamar sebagai VM
          echo "${{ secrets.VM_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Kunci deploy di VM dibatasi hanya boleh menjalankan scripts/deploy.sh,
      # dan teks setelah alamat VM diteruskan sebagai tag image yang dipasang
      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" "${{ github.sha }}"

      - name: Hapus kunci SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  backend:
    build: .
    # Image dari GitHub Container Registry, dibangun dan dites oleh CI.
    # IMAGE_TAG diisi scripts/deploy.sh dengan sha commit. Tanpa IMAGE_TAG
    # dipakai latest, dan `docker compose up -d --build` tetap bisa dipakai
    # untuk membangun langsung di VM bila registry tidak tersedia
    image: ghcr.io/deadbear34/hris-backend:${IMAGE_TAG:-latest}
    container_name: hris-backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: "8080"
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:8080:8080"
    init: true
    depends_on:
      redis:
        condition: service_healthy
    logging: *logging

  redis:
    image: redis:7-alpine
    container_name: hris-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

volumes:
  redis-data:
